name: ci
# Compile feedback on every push, using GitHub's runners instead of a local toolchain.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: System deps (tauri on linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: cargo fmt
        working-directory: app/src-tauri
        run: cargo fmt --check
      - name: cargo check
        working-directory: app/src-tauri
        run: cargo check --all-targets
      - name: cargo clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test --all-targets

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the MCP server against a stub control plane
        working-directory: mcp
        run: node --test

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pytest cryptography
      - name: Test the release tooling
        run: python -m pytest tests -q
      - name: The verifier must accept the project's own fixtures
        run: python scripts/verify_update.py tests/fixtures --pubkey tests/fixtures/pubkey.txt
