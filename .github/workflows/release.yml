name: release
# Builds the desktop installers on GitHub runners, so no Rust toolchain is needed
# on anyone's machine. Releases are created as DRAFTS — nothing goes live by accident.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the release as a draft"
        default: "true"
        type: choice
        options: ["true", "false"]
      tag:
        description: "Tag to build for. Must match the app version. Empty falls back to the pushed tag"
        default: "v0.2.1"
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend deps
        working-directory: app
        run: npm ci || npm install

      - name: The tag must match the app version
        working-directory: app
        shell: bash
        env:
          REQUESTED: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # An installer built from 0.2.0 must never be published as v0.3.0: the
          # updater compares versions, so a mismatch silently breaks updates.
          app_ver=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          tag="${REQUESTED#v}"
          echo "app=$app_ver tag=$tag"
          if [ "$app_ver" != "$tag" ]; then
            echo "::error::tag v$tag does not match the app version $app_ver"
            exit 1
          fi

      - name: Build and attach to a release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.0.0-dev' }}
          releaseName: "Forge Studio ${{ github.event.inputs.tag || github.ref_name || 'dev' }}"
          releaseBody: |
            Desktop studio for the forge-images pipeline.

            Compose prompt sets, dispatch the GitHub render pipeline, watch the run live,
            preview the result and download it. The OpenRouter key lives in your OS
            credential store, never in a file and never in the app's UI state.

            Built on GitHub's own runners — no local toolchain required.
          releaseDraft: ${{ github.event.inputs.draft != 'false' }}
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify the update signatures against the baked-in key
        shell: bash
        run: |
          # The updater refuses a release whose signature does not match the
          # pubkey compiled into the app. Check that here, where the bundles
          # still exist, rather than discovering it on a user's machine.
          #
          # --break-system-packages: macOS runners use Homebrew Python, which
          # refuses a system-wide install with "externally-managed-environment"
          # (PEP 668). Ubuntu and Windows do not care, and the flag is accepted
          # everywhere, so this is the portable form.
          python3 -m pip install --quiet --break-system-packages cryptography
          python3 scripts/verify_update.py app/src-tauri/target/release/bundle
