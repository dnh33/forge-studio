name: release
# Builds the desktop installers on GitHub runners, so no Rust toolchain is needed
# on anyone's machine. Releases are created as DRAFTS — nothing goes live by accident.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the release as a draft"
        default: "true"
        type: choice
        options: ["true", "false"]
      tag:
        description: "Tag to build for. Must match the app version. Empty falls back to the pushed tag"
        default: "v0.3.0"
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend deps
        working-directory: app
        run: npm ci || npm install

      - name: The tag must match the app version
        working-directory: app
        shell: bash
        env:
          REQUESTED: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # An installer built from 0.2.0 must never be published as v0.3.0: the
          # updater compares versions, so a mismatch silently breaks updates.
          app_ver=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          tag="${REQUESTED#v}"
          echo "app=$app_ver tag=$tag"
          if [ "$app_ver" != "$tag" ]; then
            echo "::error::tag v$tag does not match the app version $app_ver"
            exit 1
          fi

      - name: Build and attach to a release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.0.0-dev' }}
          releaseName: "Forge Studio ${{ github.event.inputs.tag || github.ref_name || 'dev' }}"
          releaseBody: |
            Desktop studio for the forge-images pipeline.

            Compose prompt sets, dispatch the GitHub render pipeline, watch the run live,
            preview the result and download it. The OpenRouter key lives in your OS
            credential store, never in a file and never in the app's UI state.

            Built on GitHub's own runners — no local toolchain required.
          releaseDraft: ${{ github.event.inputs.draft != 'false' }}
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify the update signatures against the baked-in key
        shell: bash
        run: |
          # The updater refuses a release whose signature does not match the
          # pubkey compiled into the app. Check that here, where the bundles
          # still exist, rather than discovering it on a user's machine.
          #
          # A venv, not the system interpreter: macOS runners ship a Homebrew
          # python3 that refuses `-m pip` outright (PEP 668), and --break-system-
          # packages does not help when pip itself will not start. venv is stdlib
          # on every runner image, so this is the portable form.
          python3 -m venv .verify-venv
          PY=".verify-venv/bin/python"
          [ -x "$PY" ] || PY=".verify-venv/Scripts/python.exe"
          "$PY" -m pip install --upgrade pip cryptography
          # Scan target/, not target/release: a cross-compiled build (the macOS
          # jobs pass --target) nests its bundle under target/<triple>/release/
          # bundle, so the flat path finds nothing and the check fails having
          # verified nothing at all.
          "$PY" scripts/verify_update.py app/src-tauri/target

  installer:
    # Gate the ARTIFACT, not just the build. The failure this catches happened for
    # real on 2026-10-08: an installed app registered version 0.3.0 while its binary
    # had come from a commit that predated the feature 0.3.0 claimed, and nothing in
    # CI would have said so. The version-equality assertion below is the point —
    # it enforces "a version identifies its content" mechanically.
    needs: build
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.0.0-dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the installer this release just built
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A draft release is not public, but the workflow token can read it.
          gh release download "$TAG" -p "*x64-setup.exe" --dir ./dist
          ls -l dist/

      - name: Install it, verify the version it registers, prove it runs, uninstall
        shell: bash
        run: |
          set -euo pipefail
          # The assertions live in scripts/verify_installer.sh, which is also
          # runnable by hand on a real machine, so CI and a human exercise the same
          # code instead of two implementations that drift.
          bash scripts/verify_installer.sh "$(ls dist/*x64-setup.exe | head -1)" "$TAG"
