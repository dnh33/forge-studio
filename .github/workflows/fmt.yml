name: fmt
# One-shot helper: produce rustfmt-canonical sources on a runner and upload them,
# so no local Rust toolchain is needed to satisfy the `cargo fmt --check` gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        working-directory: app/src-tauri
        run: cargo fmt
      - name: Show what changed
        run: git --no-pager diff --stat
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-src
          path: app/src-tauri/src
          retention-days: 3
